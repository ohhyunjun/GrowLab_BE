spring.application.name=GrowLab_BE
server.port=${PORT:5000}

# Email verification / account recovery: configure SMTP values in the deployment environment.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/growlab_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.secret.key=${JWT_SECRET_KEY:bG9jYWwtZGV2LXNlY3JldC1rZXktYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw==}
jwt.expiration.time=${JWT_EXPIRATION_TIME:3600000000}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.show_sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${SPRING_JPA_USE_SQL_COMMENTS:true}

# Multipart
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.max-file-size=50MB

# MQTT
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=${MQTT_CLIENT_ID:growlab-server}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.tls.ca-cert-base64=${MQTT_TLS_CA_CERT_BASE64:}

# Uploads
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
file.upload-dir.camera=${FILE_UPLOAD_DIR_CAMERA:${file.upload-dir}/camera}
file.upload-dir.article=${FILE_UPLOAD_DIR_ARTICLE:${file.upload-dir}/article}
app.storage.type=${APP_STORAGE_TYPE:local}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:ap-northeast-2}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

# OpenAI API
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}

# KAMIS API
kamis.api.key=${KAMIS_API_KEY:}
kamis.api.id=${KAMIS_API_ID:}

# Flask inference server
inference.server.url=${INFERENCE_SERVER_URL:http://localhost:5000}
